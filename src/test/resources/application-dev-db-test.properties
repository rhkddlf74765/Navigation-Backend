spring.datasource.url=${DEV_DB_URL}
spring.datasource.username=${DEV_DB_USERNAME}
spring.datasource.password=${DEV_DB_PASSWORD}

navigation.request-srid=4326
navigation.metric-srid=${DEV_NAVIGATION_METRIC_SRID:5186}
navigation.candidate-radius-meters=${DEV_NAVIGATION_CANDIDATE_RADIUS_METERS:10.0}
navigation.max-start-candidates=${DEV_NAVIGATION_MAX_START_CANDIDATES:20}

navigation.walkable-highways[0]=footway
navigation.walkable-highways[1]=pedestrian
navigation.walkable-highways[2]=steps
navigation.walkable-highways[3]=path
navigation.walkable-highways[4]=corridor
navigation.walkable-highways[5]=living_street

dev.test.start-lon=${DEV_TEST_START_LON}
dev.test.start-lat=${DEV_TEST_START_LAT}
dev.test.start-ele=${DEV_TEST_START_ELE:0.0}
dev.test.destination-building=${DEV_TEST_DESTINATION_BUILDING}
