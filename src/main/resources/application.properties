spring.application.name=campus-navigation-backend

# PostgreSql
spring.datasource.url=${DEV_DB_URL}
spring.datasource.username=${DEV_DB_USERNAME}
spring.datasource.password=${DEV_DB_PASSWORD}

# 요청 좌표계 srid
navigation.request-srid=4326
navigation.metric-srid=5186
navigation.building-srid=5179

# 내부 계산용 좌표계
navigation.metric-srid=5186

# 현재 위치 기준 시작 후보 노드를 찾을 반경
navigation.candidate-radius-meters=10.0

# 시작 후보 노드의 최대 개수
navigation.max-start-candidates=20


navigation.projection-radius-meters=30.0
navigation.projection-max-candidates=20
navigation.spatial-index-cell-size-meters=25.0

navigation.nearby-building.search-radius-meters=70.0
navigation.nearby-building.max-results=8
navigation.spatial-state.indoor-confirm-count=2
navigation.spatial-state.outdoor-confirm-count=2
navigation.spatial-state.boundary-uncertain-meters=3.0
navigation.spatial-state.cv-min-confidence=0.70
navigation.spatial-state.stale-after-seconds=120


# 보행 가능한 도로 유형 목록
navigation.walkable-highways[0]=footway
navigation.walkable-highways[1]=pedestrian
navigation.walkable-highways[2]=steps
navigation.walkable-highways[3]=path
navigation.walkable-highways[4]=corridor
navigation.walkable-highways[5]=living_street
