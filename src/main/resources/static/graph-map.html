<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Graph Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .toolbar {
            position: fixed;
            top: 12px;
            left: 50px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            font-size: 13px;
        }

        .toolbar button {
            border: 1px solid #b8c0cc;
            border-radius: 4px;
            background: #ffffff;
            padding: 6px 10px;
            cursor: pointer;
        }

        .toolbar label {
            display: flex;
            gap: 4px;
            align-items: center;
            white-space: nowrap;
        }

        #status {
            min-width: 180px;
            color: #334155;
        }
    </style>
</head>
<body>
<div class="toolbar">
    <button id="reloadButton" type="button">Reload</button>
    <label><input id="edgeToggle" type="checkbox" checked> Lines</label>
    <label><input id="nodeToggle" type="checkbox" checked> Points</label>
    <span id="status">Loading graph...</span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([37.557, 127.045], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const edgeLayer = L.layerGroup().addTo(map);
    const nodeLayer = L.layerGroup().addTo(map);
    const projectionLayer = L.layerGroup().addTo(map);
    const statusElement = document.getElementById('status');
    const edgeToggle = document.getElementById('edgeToggle');
    const nodeToggle = document.getElementById('nodeToggle');
    const reloadButton = document.getElementById('reloadButton');

    function toLatLng(point) {
        return [point.lat, point.lon];
    }

    const edgePalette = [
        '#dc2626', '#2563eb', '#16a34a', '#f59e0b', '#7c3aed',
        '#0891b2', '#db2777', '#65a30d', '#ea580c', '#4f46e5',
        '#0f766e', '#9333ea', '#be123c', '#0284c7', '#ca8a04',
        '#15803d', '#c026d3', '#b45309', '#0369a1', '#475569'
    ];

    function edgeStyle(edge) {
        const color = edgePalette[edge.colorIndex % edgePalette.length];
        const style = {
            color,
            weight: edge.edgeType === 'entrance_connector' ? 2 : 3,
            opacity: 0.78
        };

        if (edge.edgeType === 'entrance_connector') {
            style.dashArray = '4 4';
        }

        return style;
    }

    function nodeStyle(type) {
        if (type === 'ENTRANCE') {
            return { radius: 4, color: '#1d4ed8', fillColor: '#3b82f6', fillOpacity: 0.9, weight: 1 };
        }
        if (type === 'PROJECTION') {
            return { radius: 3, color: '#a855f7', fillColor: '#c084fc', fillOpacity: 0.8, weight: 1 };
        }
        return { radius: 2, color: '#0f766e', fillColor: '#14b8a6', fillOpacity: 0.75, weight: 1 };
    }

    function drawProjection(result) {
        projectionLayer.clearLayers();

        const sourceLatLng = toLatLng(result.sourcePoint);
        const projectedLatLng = toLatLng(result.projectedPoint);
        const edgePath = result.edgePath.map(toLatLng);

        L.polyline(edgePath, {
            color: '#111827',
            weight: 8,
            opacity: 0.82
        }).addTo(projectionLayer);

        L.polyline([sourceLatLng, projectedLatLng], {
            color: '#f97316',
            weight: 4,
            opacity: 0.95,
            dashArray: '6 6'
        }).addTo(projectionLayer);

        L.circleMarker(sourceLatLng, {
            radius: 7,
            color: '#ea580c',
            fillColor: '#fb923c',
            fillOpacity: 0.95,
            weight: 2
        }).bindPopup('clicked point').addTo(projectionLayer);

        L.circleMarker(projectedLatLng, {
            radius: 7,
            color: '#0f172a',
            fillColor: '#facc15',
            fillOpacity: 0.95,
            weight: 2
        }).bindPopup(
            `projected point<br>` +
            `edge: ${result.fromNodeId} -> ${result.toNodeId}<br>` +
            `type: ${result.edgeType}<br>` +
            `distance: ${result.distanceFromSource.toFixed(2)}m<br>` +
            `from-start cost: ${result.costFromEdgeStart.toFixed(2)}<br>` +
            `to-end cost: ${result.costToEdgeEnd.toFixed(2)}`
        ).addTo(projectionLayer);

        statusElement.textContent = `Projection distance ${result.distanceFromSource.toFixed(2)}m`;
    }

    function drawGraph(graph) {
        edgeLayer.clearLayers();
        nodeLayer.clearLayers();

        const bounds = [];

        graph.edges.forEach(edge => {
            const path = edge.path.map(toLatLng);
            if (path.length < 2) {
                return;
            }

            L.polyline(path, edgeStyle(edge))
                .bindPopup(`edge: ${edge.fromNodeId} -> ${edge.toNodeId}<br>type: ${edge.edgeType}<br>color: ${edge.colorIndex}<br>cost: ${edge.cost.toFixed(2)}`)
                .addTo(edgeLayer);
            bounds.push(...path);
        });

        graph.nodes.forEach(node => {
            const latLng = toLatLng(node.point);
            L.circleMarker(latLng, nodeStyle(node.type))
                .bindPopup(`node: ${node.nodeId}<br>type: ${node.type}`)
                .addTo(nodeLayer);
            bounds.push(latLng);
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [24, 24] });
        }

        statusElement.textContent = `Lines ${graph.edges.length.toLocaleString()} / Points ${graph.nodes.length.toLocaleString()}`;
    }

    async function loadGraph() {
        statusElement.textContent = 'Loading graph...';

        const response = await fetch('/api/test/graph-map');
        if (!response.ok) {
            throw new Error(`Graph API failed: ${response.status}`);
        }

        drawGraph(await response.json());
    }

    async function projectPoint(latLng) {
        statusElement.textContent = 'Projecting point...';

        const response = await fetch('/api/test/graph-map/projections', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                lat: latLng.lat,
                lon: latLng.lng,
                ele: 0
            })
        });

        if (!response.ok) {
            throw new Error(`Projection API failed: ${response.status}`);
        }

        drawProjection(await response.json());
    }

    edgeToggle.addEventListener('change', () => {
        if (edgeToggle.checked) {
            edgeLayer.addTo(map);
        } else {
            edgeLayer.remove();
        }
    });

    nodeToggle.addEventListener('change', () => {
        if (nodeToggle.checked) {
            nodeLayer.addTo(map);
        } else {
            nodeLayer.remove();
        }
    });

    reloadButton.addEventListener('click', () => {
        loadGraph().catch(error => {
            statusElement.textContent = error.message;
        });
    });

    map.on('click', event => {
        projectPoint(event.latlng).catch(error => {
            statusElement.textContent = error.message;
        });
    });

    loadGraph().catch(error => {
        statusElement.textContent = error.message;
    });
</script>
</body>
</html>
